<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Toko</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-box">
    <div class="text-center mb-6">
      <h1 class="font-bold text-gray-800" style="font-size: 1.5rem;">Sistem Toko</h1>
      <p class="text-sm text-muted mt-1">Silakan login untuk mengelola data</p>
    </div>

    <div class="card">
      <div class="alert alert-danger">
        <span>Username atau password salah.</span>
      </div>

      <form action="dashboard.html" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username / Email</label>
          <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Masukkan password" required>
        </div>

        <div class="flex items-center justify-between mb-4">
          <label class="flex items-center text-sm text-muted" style="cursor: pointer;">
            <input type="checkbox" id="remember" style="margin-right: 0.5rem;"> Ingat saya
          </label>
          <a href="#" class="text-xs text-primary" style="text-decoration: underline;">Lupa password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full">Login</button>
      </form>

      <div class="mt-4 text-center text-sm text-muted" style="border-top: 1px solid #e5e7eb; padding-top: 1rem;">
        Belum punya akun? <a href="register.html" class="text-primary font-medium" style="text-decoration: underline;">Daftar</a>
      </div>
    </div>

    <p class="text-center text-xs text-muted mt-6">&copy; 2026 Sistem Toko</p>
  </div>

</body>
</html>
