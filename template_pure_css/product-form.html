<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Barang - Sistem Toko</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">ST</div>
        <div>
          <h2 class="font-bold" style="line-height: 1.2;">Sistem Toko</h2>
          <span class="text-xs text-muted">Admin Panel</span>
        </div>
      </div>

      <div class="sidebar-menu">
        <span class="sidebar-label">Menu Utama</span>
        <a href="dashboard.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="products.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <span>Data Barang</span>
        </a>
        <a href="product-form.html" class="sidebar-link active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
          <span>Tambah Barang</span>
        </a>

        <span class="sidebar-label" style="margin-top: 1rem;">Manajemen</span>
        <a href="#" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
          <span>Kategori</span>
        </a>
        <a href="#" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          <span>Transaksi</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="flex items-center gap-2 mb-3">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: #dbeafe; color: #1d4ed8; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 12px;">A</div>
          <div>
            <div class="font-semibold" style="font-size: 13px;">Administrator</div>
            <div class="text-xs text-muted">admin</div>
          </div>
        </div>
        <a href="login.html" class="btn btn-outline w-full text-xs" style="color: #dc2626;">Logout</a>
      </div>
    </aside>

    <div id="backdrop" class="backdrop hidden" onclick="toggleSidebar()"></div>

    <div class="main-content">
      <header class="topbar">
        <div class="flex items-center gap-3">
          <button class="menu-toggle" onclick="toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="font-semibold" style="font-size: 1.125rem;">Form Data Barang</h1>
        </div>
        <a href="products.html" class="btn btn-outline btn-sm">Kembali</a>
      </header>

      <main class="content-body">
        <div>
          <h2 class="font-bold" style="font-size: 1.25rem;">Formulir Barang</h2>
          <p class="text-xs text-muted">Isi data barang secara lengkap</p>
        </div>

        <form action="products.html" method="POST" enctype="multipart/form-data">
          <div class="card">
            <div class="grid grid-2 mb-4">
              <div>
                <div class="form-group">
                  <label class="form-label" for="kode_produk">Kode Barang</label>
                  <input type="text" id="kode_produk" class="form-input" placeholder="Misal: BRG-001" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="nama_produk">Nama Barang</label>
                  <input type="text" id="nama_produk" class="form-input" placeholder="Masukkan nama barang" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="kategori">Kategori</label>
                  <select id="kategori" class="form-select" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="ATK">ATK</option>
                    <option value="Komputer">Komputer</option>
                    <option value="Perlengkapan">Perlengkapan</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="deskripsi">Deskripsi</label>
                  <textarea id="deskripsi" rows="3" class="form-textarea" placeholder="Keterangan singkat barang"></textarea>
                </div>
              </div>

              <div>
                <div class="grid grid-2 mb-3">
                  <div>
                    <label class="form-label" for="harga_beli">Harga Beli (Rp)</label>
                    <input type="number" id="harga_beli" class="form-input" placeholder="0" required>
                  </div>
                  <div>
                    <label class="form-label" for="harga_jual">Harga Jual (Rp)</label>
                    <input type="number" id="harga_jual" class="form-input" placeholder="0" required>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="stok">Jumlah Stok</label>
                  <input type="number" id="stok" class="form-input" placeholder="0" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="foto">Foto Barang</label>
                  <input type="file" id="foto" accept="image/*" class="form-input" style="padding: 0.35rem 0.5rem;">
                </div>
              </div>
            </div>

            <div class="flex items-center justify-end gap-2" style="padding-top: 1rem; border-top: 1px solid #e5e7eb;">
              <a href="products.html" class="btn btn-secondary">Batal</a>
              <button type="reset" class="btn btn-outline">Reset</button>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </div>
        </form>
      </main>

      <footer class="footer">&copy; 2026 Sistem Toko. All rights reserved.</footer>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('backdrop').classList.toggle('hidden');
    }
  </script>

</body>
</html>
