<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Toko</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Sistem Toko</h1>
      <p class="text-sm text-gray-500 mt-1">Silakan login untuk mengelola data</p>
    </div>

    <div class="card">
      <div class="alert alert-danger">
        <span>Username atau password salah.</span>
      </div>

      <form action="dashboard.html" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username / Email</label>
          <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Masukkan password" required>
        </div>

        <div class="flex items-center justify-between mb-4">
          <label class="flex items-center text-sm text-gray-600 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 text-blue-600 rounded border-gray-300 mr-2">
            Ingat saya
          </label>
          <a href="#" class="text-xs text-blue-600 hover:underline">Lupa password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full">Login</button>
      </form>

      <div class="mt-4 pt-4 border-t text-center text-sm text-gray-600">
        Belum punya akun? <a href="register.html" class="text-blue-600 font-medium hover:underline">Daftar</a>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">&copy; 2026 Sistem Toko</p>
  </div>

</body>
</html>
