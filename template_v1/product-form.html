<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Barang - Sistem Toko</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex">

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 flex flex-col transition-transform duration-200 -translate-x-full lg:translate-x-0 lg:static">
    <div class="h-16 flex items-center gap-3 px-6 border-b">
      <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-sm">ST</div>
      <div>
        <h2 class="font-bold text-gray-900 leading-none">Sistem Toko</h2>
        <span class="text-xs text-gray-400">Admin Panel</span>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-1">
      <a href="dashboard.html" class="sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span>Dashboard</span>
      </a>

      <a href="products.html" class="sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <span>Data Barang</span>
      </a>

      <a href="product-form.html" class="sidebar-link active">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span>Tambah Barang</span>
      </a>

      <a href="#" class="sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
        </svg>
        <span>Kategori</span>
      </a>

      <a href="#" class="sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
        </svg>
        <span>Transaksi</span>
      </a>
    </div>

    <div class="p-4 border-t">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-xs">A</div>
        <div class="overflow-hidden">
          <h4 class="text-sm font-semibold text-gray-800 truncate">Administrator</h4>
          <p class="text-xs text-gray-400 truncate">admin</p>
        </div>
      </div>
      <a href="login.html" class="btn btn-outline w-full text-xs text-red-600 hover:bg-red-50 hover:border-red-200">Logout</a>
    </div>
  </aside>

  <div id="sidebarBackdrop" class="fixed inset-0 bg-black/30 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white border-b px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded text-gray-600 hover:bg-gray-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-800">Form Data Barang</h1>
      </div>

      <a href="products.html" class="btn btn-outline btn-sm">Kembali</a>
    </header>

    <main class="flex-1 p-4 sm:p-6 space-y-5">
      <div>
        <h2 class="text-xl font-bold text-gray-800">Formulir Barang</h2>
        <p class="text-xs text-gray-500">Isi data barang secara lengkap</p>
      </div>

      <form action="products.html" method="POST" enctype="multipart/form-data">
        <div class="card space-y-4">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="space-y-3">
              <div class="form-group">
                <label class="form-label" for="kode_produk">Kode Barang</label>
                <input type="text" id="kode_produk" class="form-input" placeholder="Misal: BRG-001" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="nama_produk">Nama Barang</label>
                <input type="text" id="nama_produk" class="form-input" placeholder="Masukkan nama barang" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="kategori">Kategori</label>
                <select id="kategori" class="form-select" required>
                  <option value="">-- Pilih Kategori --</option>
                  <option value="ATK">ATK</option>
                  <option value="Komputer">Komputer</option>
                  <option value="Perlengkapan">Perlengkapan</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="deskripsi">Deskripsi</label>
                <textarea id="deskripsi" rows="3" class="form-textarea" placeholder="Keterangan singkat barang"></textarea>
              </div>
            </div>

            <div class="space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="form-group">
                  <label class="form-label" for="harga_beli">Harga Beli (Rp)</label>
                  <input type="number" id="harga_beli" class="form-input" placeholder="0" required>
                </div>

                <div class="form-group">
                  <label class="form-label" for="harga_jual">Harga Jual (Rp)</label>
                  <input type="number" id="harga_jual" class="form-input" placeholder="0" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="stok">Jumlah Stok</label>
                <input type="number" id="stok" class="form-input" placeholder="0" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="foto">Foto Barang</label>
                <input type="file" id="foto" accept="image/*" class="w-full text-xs text-gray-500 border rounded p-2 bg-gray-50">
              </div>
            </div>
          </div>

          <div class="pt-4 border-t flex items-center justify-end gap-2">
            <a href="products.html" class="btn btn-secondary">Batal</a>
            <button type="reset" class="btn btn-outline">Reset</button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </div>
      </form>
    </main>

    <footer class="py-4 px-6 border-t bg-white text-center text-xs text-gray-400">
      &copy; 2026 Sistem Toko. All rights reserved.
    </footer>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarBackdrop').classList.toggle('hidden');
    }
  </script>

</body>
</html>
