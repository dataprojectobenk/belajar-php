<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - Sistem Toko</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Sistem Toko</h1>
      <p class="text-sm text-gray-500 mt-1">Buat akun baru admin</p>
    </div>

    <div class="card">
      <form action="login.html" method="POST">
        <div class="form-group">
          <label class="form-label" for="nama">Nama Lengkap</label>
          <input type="text" id="nama" class="form-input" placeholder="Nama lengkap Anda" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="konfirmasi_password">Ulangi Password</label>
          <input type="password" id="konfirmasi_password" class="form-input" placeholder="Ulangi password" required>
        </div>

        <div class="mb-4">
          <label class="flex items-center text-xs text-gray-600 cursor-pointer">
            <input type="checkbox" id="terms" class="w-4 h-4 text-blue-600 rounded border-gray-300 mr-2" required>
            Saya menyetujui syarat & ketentuan
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-full">Daftar Akun</button>
      </form>

      <div class="mt-4 pt-4 border-t text-center text-sm text-gray-600">
        Sudah punya akun? <a href="login.html" class="text-blue-600 font-medium hover:underline">Login</a>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">&copy; 2026 Sistem Toko</p>
  </div>

</body>
</html>
