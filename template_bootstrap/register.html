<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - Sistem Toko</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div style="max-width: 380px; width: 100%;">
    <div class="text-center mb-4">
      <h1 class="h4 fw-bold text-dark">Sistem Toko</h1>
      <p class="text-muted small">Buat akun baru admin</p>
    </div>

    <div class="card shadow-sm border-0 p-4">
      <form action="login.html" method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="nama">Nama Lengkap</label>
          <input type="text" id="nama" class="form-control" placeholder="Nama lengkap Anda" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Username" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold" for="konfirmasi_password">Ulangi Password</label>
          <input type="password" id="konfirmasi_password" class="form-control" placeholder="Ulangi password" required>
        </div>

        <div class="mb-3">
          <div class="form-check">
            <input type="checkbox" id="terms" class="form-check-input" required>
            <label class="form-check-label text-muted small" for="terms">Saya menyetujui syarat & ketentuan</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Daftar Akun</button>
      </form>

      <div class="mt-4 pt-3 border-top text-center text-muted small">
        Sudah punya akun? <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
      </div>
    </div>

    <p class="text-center text-muted small mt-4">&copy; 2026 Sistem Toko</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
