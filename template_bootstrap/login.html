<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Toko</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div style="max-width: 380px; width: 100%;">
    <div class="text-center mb-4">
      <h1 class="h4 fw-bold text-dark">Sistem Toko</h1>
      <p class="text-muted small">Silakan login untuk mengelola data</p>
    </div>

    <div class="card shadow-sm border-0 p-4">
      <div class="alert alert-danger py-2 px-3 small">
        Username atau password salah.
      </div>

      <form action="dashboard.html" method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="username">Username / Email</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" id="remember" class="form-check-input">
            <label class="form-check-label text-muted small" for="remember">Ingat saya</label>
          </div>
          <a href="#" class="text-decoration-none small">Lupa password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <div class="mt-4 pt-3 border-top text-center text-muted small">
        Belum punya akun? <a href="register.html" class="text-decoration-none fw-semibold">Daftar</a>
      </div>
    </div>

    <p class="text-center text-muted small mt-4">&copy; 2026 Sistem Toko</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
