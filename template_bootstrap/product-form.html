<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Barang - Sistem Toko</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">ST</div>
      <div>
        <h2 class="h6 fw-bold mb-0 text-dark">Sistem Toko</h2>
        <span class="text-muted small" style="font-size: 11px;">Admin Panel</span>
      </div>
    </div>

    <div class="sidebar-menu">
      <span class="sidebar-label">Menu Utama</span>
      <a href="dashboard.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="products.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span>Data Barang</span>
      </a>
      <a href="product-form.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
        <span>Tambah Barang</span>
      </a>

      <span class="sidebar-label mt-3">Manajemen</span>
      <a href="#" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
        <span>Kategori</span>
      </a>
      <a href="#" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        <span>Transaksi</span>
      </a>
      <a href="#" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Laporan</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="d-flex align-items-center gap-2 mb-3">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #cfe2ff; color: #084298; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 12px;">A</div>
        <div>
          <div class="fw-semibold small">Administrator</div>
          <div class="text-muted" style="font-size: 11px;">admin</div>
        </div>
      </div>
      <a href="login.html" class="btn btn-outline-danger btn-sm w-100">Logout</a>
    </div>
  </aside>

  <div id="sidebarBackdrop" class="sidebar-backdrop d-none" onclick="toggleSidebar()"></div>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light d-lg-none p-1 border" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="h6 fw-bold mb-0">Form Data Barang</h1>
      </div>
      <a href="products.html" class="btn btn-outline-secondary btn-sm">Kembali</a>
    </header>

    <main class="content-body">
      <div class="mb-3">
        <h2 class="h5 fw-bold mb-1">Formulir Barang</h2>
        <p class="text-muted small mb-0">Isi data barang secara lengkap</p>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form action="products.html" method="POST" enctype="multipart/form-data">
            <div class="row g-4 mb-4">
              <div class="col-12 col-lg-6">
                <div class="mb-3">
                  <label for="kode_produk" class="form-label small fw-semibold">Kode Barang</label>
                  <input type="text" id="kode_produk" class="form-control" placeholder="Misal: BRG-001" required>
                </div>
                <div class="mb-3">
                  <label for="nama_produk" class="form-label small fw-semibold">Nama Barang</label>
                  <input type="text" id="nama_produk" class="form-control" placeholder="Masukkan nama barang" required>
                </div>
                <div class="mb-3">
                  <label for="kategori" class="form-label small fw-semibold">Kategori</label>
                  <select id="kategori" class="form-select" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="ATK">ATK</option>
                    <option value="Komputer">Komputer</option>
                    <option value="Perlengkapan">Perlengkapan</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="deskripsi" class="form-label small fw-semibold">Deskripsi</label>
                  <textarea id="deskripsi" rows="3" class="form-control" placeholder="Keterangan singkat barang"></textarea>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="harga_beli" class="form-label small fw-semibold">Harga Beli (Rp)</label>
                    <input type="number" id="harga_beli" class="form-control" placeholder="0" required>
                  </div>
                  <div class="col-6">
                    <label for="harga_jual" class="form-label small fw-semibold">Harga Jual (Rp)</label>
                    <input type="number" id="harga_jual" class="form-control" placeholder="0" required>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="stok" class="form-label small fw-semibold">Jumlah Stok</label>
                  <input type="number" id="stok" class="form-control" placeholder="0" required>
                </div>
                <div class="mb-3">
                  <label for="foto" class="form-label small fw-semibold">Foto Barang</label>
                  <input type="file" id="foto" accept="image/*" class="form-control">
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
              <a href="products.html" class="btn btn-secondary">Batal</a>
              <button type="reset" class="btn btn-outline-secondary">Reset</button>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="py-3 px-4 bg-white border-top text-center text-muted small">&copy; 2026 Sistem Toko. All rights reserved.</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('sidebarBackdrop').classList.toggle('d-none');
    }
  </script>
</body>
</html>
